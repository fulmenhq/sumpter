$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Sumpter Recipe Manifest"
description: "Structured metadata for Sumpter recipe workspaces"
type: object
additionalProperties: false
required:
  - version
  - id
  - kind
  - assets
properties:
  version:
    type: string
    const: "recipe/v0.1.0"
  id:
    type: string
    pattern: "^[a-zA-Z0-9_.-]+$"
  kind:
    type: string
    enum: ["extract", "acquire"]
  display_name:
    type: string
    maxLength: 200
  description:
    type: string
  tags:
    type: array
    items:
      type: string
  created_at:
    type: string
    format: date-time
  content_version:
    description: |
      Author-managed SemVer 2.0.0 version for the recipe's extraction
      content (signature + extract assets). Optional in v0.1.3; sumpter
      emits a deprecation warning when absent and records
      `recipe_version` as "unversioned" in provenance. v0.1.4 will make
      this a required field and bump the manifest schema to v0.2.0.
      See ADR-0006 for the canonicalization and content-hash rules.
    type: string
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
  owners:
    type: array
    items:
      type: object
      required: ["name"]
      additionalProperties: false
      properties:
        name:
          type: string
        contact:
          description: |
            Optional contact for the owner (typically an email). Required
            when the recipe participates in v0.1.4+ signing/encryption
            attestation.
          type: string
        role:
          description: |
            Optional role slug (e.g. "india-devlead") identifying the
            owner's chain-of-trust position. Required when the recipe
            participates in v0.1.4+ signing/encryption attestation.
          type: string
  documentation:
    type: object
    additionalProperties: false
    properties:
      overview:
        type: string
      changelog:
        type: string
      references:
        type: array
        items:
          type: string
  assets:
    type: object
    additionalProperties: false
    required: []
    properties:
      signature:
        type: string
      extract:
        type: string
      applicability:
        type: string
        description: |
          Optional path to a YAML asset declaring a recipe-applicability
          predicate. Evaluated before the signature predicate; non-match
          resolves the per-input disposition to not_applicable.
      validation:
        type: string
      retrieve:
        type: string
      extras:
        type: array
        items:
          type: string
  defaults:
    type: object
    additionalProperties: false
    properties:
      cadence:
        type: string
        description: |
          Operator-readable run cadence intent. Sumpter records this value in
          provenance but does not schedule, enforce, or interpret it at runtime.
          Recommended values include daily-rolling, weekly, weekly-2x,
          on-demand, hourly, monthly, and quarterly; recipe authors and
          orchestrators own the vocabulary.
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
        maxLength: 64
      input:
        type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum: ["files", "path"]
          files:
            type: array
            items:
              type: string
          path:
            type: string
          credentials_handle:
            type: string
            description: "Credential handle name for cloud (s3://) source input. A handle reference, never a secret; resolved from the credentials config. A --input-credentials-handle CLI value overrides this."
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          include_pattern:
            type: string
          exclude_pattern:
            type: string
          max_depth:
            type: integer
            minimum: 0
          follow_symlinks:
            type: boolean
      output:
        type: object
        additionalProperties: false
        properties:
          format:
            type: string
            enum: ["json", "ndjson", "parquet"]
          formats:
            type: array
            items:
              type: string
              enum: ["json", "ndjson", "parquet"]
            uniqueItems: true
          path:
            type: string
          credentials_handle:
            type: string
            description: "Credential handle name for cloud (s3://) output. A handle reference, never a secret; resolved from the credentials config. A --output-credentials-handle CLI value overrides this."
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          pattern:
            type: string
          patterns:
            type: object
            propertyNames:
              enum: ["json", "ndjson", "parquet"]
            additionalProperties:
              type: string
          uniform_schema:
            type: boolean
          parquet:
            type: object
            additionalProperties: false
            properties:
              compression:
                type: string
                enum: ["zstd", "snappy", "gzip", "none"]
              withhold_columns:
                type: array
                items:
                  type: string
                  pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
                uniqueItems: true
      client_id:
        type: string
      site_id:
        type: string
      parameters:
        type: object
        description: |
          Free-form key/value pairs injected as fields into every
          extracted record's extract.data block and into
          field_mappings[].expression evaluation scope (as bare DSL
          variables, not $variables). Keys must not collide with
          XPath-extracted or expression-derived output field names. A value
          is either a literal string scalar or a list of strings; a list is
          read by the membership/prefix DSL helpers (starts_with_any,
          value_in). List members must be non-empty strings — numbers,
          booleans, objects, nested or mixed arrays, and empty members are
          rejected. A run-time --parameter key='["a","b"]' overrides a
          default; a CLI value is a list only when it is a valid JSON array
          of strings, otherwise it stays a literal string.
        additionalProperties:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
                minLength: 1
      parameters_required:
        type: array
        description: |
          Parameter keys that must resolve to a non-empty value at
          recipe run time, from defaults.parameters or CLI
          --parameter key=value overrides.
        items:
          type: string
          minLength: 1
        uniqueItems: true
      source_extraction:
        type: array
        description: |
          File-level fields extracted once from the input filename,
          relative_path, or absolute_path before record extraction.
        maxItems: 32
        items:
          type: object
          additionalProperties: false
          required: ["source", "pattern"]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*$"
              maxLength: 64
            source:
              type: string
              enum: ["filename", "relative_path", "absolute_path"]
            pattern:
              type: string
              maxLength: 1024
      source_extraction_required:
        type: array
        description: |
          Source-derived field names that must be captured from each
          source file before defaults.parameters or CLI parameters are
          merged.
        items:
          type: string
          minLength: 1
        uniqueItems: true
      reference_tables:
        type: array
        description: |
          External reference tables loaded once per run to back the
          in_reference (membership / Pattern A) and lookup_reference
          (key→value / Pattern B) DSL functions. Each source is either a
          contained workspace-relative path (absolute paths, ".." escapes,
          and symlinks are refused) or an s3:// URI to a single object with a
          credentials_handle; format, columns, and caps are fixed by the
          recipe so a --reference-table source override (refreshing the
          data) cannot drift the schema.
        items:
          type: object
          additionalProperties: false
          required: [name, source, format, max_rows]
          oneOf:
            - required: [column]
            - required: [key_column, value_column]
          properties:
            name:
              type: string
              description: |
                Table name referenced as a string literal in
                in_reference('name', field) / lookup_reference('name',
                field, default).
              pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
              maxLength: 128
            source:
              type: string
              description: |
                Workspace-relative path to the table file (contained — no
                absolute paths, "..", or symlinks), or an s3:// URI for a
                cloud source.
              minLength: 1
            credentials_handle:
              type: string
              description: |
                Credential handle name for an s3:// source. A handle
                reference, never a secret; resolved from the credentials
                config. Omit for local sources.
              pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
            format:
              type: string
              enum: ["csv", "tsv", "ndjson"]
            header:
              type: boolean
              description: |
                csv/tsv only — the first row is a header. Required true to
                reference columns by name.
            column:
              type: string
              description: |
                Membership (Pattern A) — the single column whose distinct
                values form the set queried by in_reference.
              minLength: 1
            key_column:
              type: string
              description: |
                Key→value lookup (Pattern B) — the key column matched by
                lookup_reference.
              minLength: 1
            value_column:
              type: string
              description: |
                Key→value lookup (Pattern B) — the value column returned by
                lookup_reference.
              minLength: 1
            max_rows:
              type: integer
              minimum: 1
              description: |
                Fail-loud cap on physical source rows (no partial load).
            max_bytes:
              type: integer
              minimum: 1
              description: |
                Fail-loud pre-read byte cap; defaults to 100 MiB when
                omitted.
      workers:
        type: integer
        minimum: 1
      progress:
        type: boolean
  notes:
    type: string
