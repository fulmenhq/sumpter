# Sumpter Inspect Report Schema (v0.1.0)
# JSON Schema 2020-12 for validating inspect command JSON output
# This schema defines the structure of inspection reports generated by sumpter inspect

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://sumpterhq.github.io/schemas/inspect/v0.1.0/inspect-report.schema.yaml

title: Sumpter Inspect Report (v0.1.0)
description: |
  Schema for JSON output from sumpter inspect command.
  Provides structured validation for XML inspection results including
  encoding detection, path analysis, and performance metrics.

type: object
additionalProperties: false

required:
  - version
  - input
  - metrics
  - paths
  - caps

properties:
  version:
    type: string
    const: inspect-report/v0.1.0
    description: Schema version identifier

  input:
    type: object
    description: Information about the input file being inspected
    additionalProperties: false
    required:
      - path
      - size_bytes
      - encoding_detected
    properties:
      path:
        type: string
        description: Path to the inspected file (or "<stdin>" for stdin input)
      size_bytes:
        type: integer
        minimum: -1
        description: Size of input file in bytes (-1 for stdin)
      encoding_detected:
        type: string
        description: Detected character encoding (e.g., "UTF-8", "windows-1252")
      encoding_forced:
        type: [string, "null"]
        description: Encoding that was explicitly forced via --force-encoding flag

  metrics:
    type: object
    description: Performance and processing metrics from the inspection
    additionalProperties: false
    required:
      - bytes_processed
      - elapsed_ms
      - throughput_bytes_per_sec
      - replacement_count
    properties:
      bytes_processed:
        type: integer
        minimum: 0
        description: Total bytes processed during inspection
      elapsed_ms:
        type: integer
        minimum: 0
        description: Time taken for inspection in milliseconds
      throughput_bytes_per_sec:
        type: number
        minimum: 0
        description: Processing throughput in bytes per second
      replacement_count:
        type: integer
        minimum: 0
        description: Number of character encoding replacements made
      rss_peak_mb:
        type: number
        minimum: 0
        description: Peak resident set size (RSS) memory usage in MB

  paths:
    type: array
    description: Array of unique XML element paths found during inspection
    items:
      type: object
      description: Information about a specific XML element path
      additionalProperties: false
      required:
        - path
        - count
      properties:
        path:
          type: string
          description: Dot-notation XML path (e.g., "Envelope.Header.Message")
        count:
          type: integer
          minimum: 0
          description: Number of times this path was encountered
        attributes:
          type: array
          description: Attributes found on elements at this path
          default: []
          items:
            type: object
            description: Information about a specific attribute
            additionalProperties: false
            required:
              - name
              - count
            properties:
              name:
                type: string
                description: Attribute name
              count:
                type: integer
                minimum: 0
                description: Number of times this attribute was encountered
        samples:
          type: array
          description: Text content samples from elements at this path
          items:
            type: string

  caps:
    type: object
    description: Capacity limits and truncation indicators
    additionalProperties: false
    required:
      - paths_truncated
      - attributes_truncated
      - samples_truncated
    properties:
      paths_truncated:
        type: boolean
        description: True if path tracking was truncated due to --max-paths limit
      attributes_truncated:
        type: boolean
        description: True if attribute tracking was truncated (future feature)
      samples_truncated:
        type: boolean
        description: True if text samples were truncated due to per-path limits

  metadata:
    type: object
    description: Optional metadata about the inspection process
    additionalProperties: true  # Allow flexible metadata
    properties:
      generator:
        type: string
        description: Tool that generated this report
      timestamp:
        type: string
        format: date-time
        description: RFC3339 timestamp when report was generated
      tags:
        type: object
        description: Optional key-value tags for categorization
        additionalProperties:
          type: string