$schema: "https://json-schema.org/draft/2020-12/schema"
title: Extract Record Match Schema
description: User configuration for extracting specific records from XML files without hardcoding patterns. Enables dynamic extraction of structured data based on XPath selectors and field mappings.
type: object
properties:
  record_type:
    type: string
    description: The type of record to extract (e.g., "transaction", "event").
  match_selectors:
    type: array
    description: Array of selectors used to identify matching records in the XML.
    items:
      type: object
      properties:
        xpath:
          type: string
          description: XPath expression to locate the record element.
        attributes:
          type: object
          description: Optional key-value pairs of attributes that must match on the selected element.
        min_occurrences:
          type: integer
          description: Minimum number of occurrences required for a match.
          minimum: 0
          default: 1
      required:
        - xpath
  fields_to_extract:
    type: array
    description: Array of fields to extract from each matching record, with XPath mappings and type information.
    items:
      type: object
      properties:
        name:
          type: string
          description: The name of the field in the output.
        xpath:
          type: string
          description: XPath expression relative to the record element to extract the value.
        type:
          type: string
          description: The expected data type of the field.
          enum: ["string", "number", "integer", "boolean", "array"]
        transform:
          type: string
          description: Optional transformation function to apply to the extracted value.
      required:
        - name
        - xpath
        - type
  output_schema:
    type: object
    description: JSON schema defining the structure of the output data. This should be a valid JSON Schema object that describes the expected output format.
  field_mappings:
    type: array
    description: Array of mappings from input XPath expressions to output schema fields.
    items:
      type: object
      properties:
        output_field:
          type: string
          description: The field name in the output schema to map to.
        xpath:
          type: string
          description: XPath expression relative to the record element to extract the value.
        type:
          type: string
          description: The expected data type of the field.
          enum: ["string", "number", "integer", "boolean", "array"]
        transform:
          type: string
          description: Optional transformation function to apply to the extracted value.
        transform_params:
          type: object
          description: Parameters to be supplied to the transform function.
          additionalProperties: true
        item_mapping:
          type: array
          description: For array types, defines how to map each array item.
          items:
            type: object
            properties:
              output_field:
                type: string
                description: The field name in the array item.
              xpath:
                type: string
                description: XPath relative to the array item element.
              type:
                type: string
                enum: ["string", "number", "integer", "boolean", "array"]
              transform:
                type: string
                description: Optional transformation for the item field.
            required:
              - output_field
              - xpath
              - type
        polymorphic_mapping:
          type: array
          description: For array types with varying item structures, defines polymorphic mappings.
          items:
            type: object
            properties:
              item_type:
                type: string
                description: Type identifier for this mapping.
              match_xpath:
                type: string
                description: XPath expression to locate matching nodes.
              element_type:
                type: string
                description: Element name to match when using child lookup.
              field_mappings:
                type: array
                items:
                  $ref: "#/properties/field_mappings/items"
            required:
              - field_mappings
      required:
        - output_field
        - xpath
        - type
  external_fields:
    type: array
    description: Fields that are provided externally at runtime, not extracted from the XML.
    items:
      type: object
      properties:
        name:
          type: string
          description: The name of the external field.
        type:
          type: string
          description: The expected data type of the field.
          enum: ["string", "number", "integer", "boolean", "array"]
        required:
          type: boolean
          description: Whether this external field is required.
          default: false
      required:
        - name
        - type
  filters:
    type: object
    description: Optional filters to apply after extraction, using field names as keys with comparison operators.
  output_options:
    type: object
    description: Configure optional sections and output format for extract results
    properties:
      show_summaries:
        type: boolean
        default: true
        description: Include summary block inside extract output
      show_validation_metadata:
        type: boolean
        default: true
        description: Include validation audit block when validation metadata is enabled
      format:
        type: string
        enum: ["object"]
        default: "object"
        description: Output format (currently only structured object output is supported)
  validation_metadata:
    type: object
    description: Optional validation metadata generation for data quality verification
    properties:
      enable:
        type: boolean
        default: false
        description: Enable validation metadata generation
      expression_language:
        type: string
        enum: ["sumpter-dsl", "jmespath", "jsonata", "cel"]
        default: "sumpter-dsl"
        description: Expression language for filters, aggregations, and validation rules
      placement:
        type: string
        enum: ["footer", "header", "separate_file"]
        default: "footer"
        description: Where to place validation metadata in output
      failure_policy:
        type: object
        description: Policy for handling validation failures
        properties:
          fail_on_fatal:
            type: boolean
            default: true
            description: Fail extraction if any fatal validation fails
          error_threshold:
            type: integer
            minimum: 0
            description: Fail extraction if error count exceeds this threshold
          warning_threshold:
            type: integer
            minimum: 0
            description: Log warning if warning count exceeds this threshold
          halt_on_first_fatal:
            type: boolean
            default: true
            description: Stop extraction immediately on first fatal error
      accumulations:
        type: array
        description: Incremental operations computed during extraction (per-record)
        items:
          type: object
          properties:
            name:
              type: string
              description: Name for the accumulation result
            operation:
              type: string
              enum: ["count", "sum", "min", "max", "avg", "increment"]
              description: Type of accumulation operation
            field:
              type: string
              description: Field path to operate on (for sum, min, max, avg)
            filter:
              type: string
              description: Optional filter expression (e.g., "is_suspended == false")
          required:
            - name
            - operation
      aggregations:
        type: array
        description: Post-processing aggregations over complete dataset
        items:
          type: object
          properties:
            name:
              type: string
              description: Name for the aggregation result
            expression:
              type: string
              description: Expression to evaluate (can reference accumulations and other aggregations)
            compare_to:
              type: string
              description: Optional field from extraction to compare against
            tolerance:
              type: number
              default: 0.01
              description: Acceptable difference for numeric comparisons
          required:
            - name
            - expression
      reconciliations:
        type: array
        description: Structured reconciliations explaining differences between aggregates
        items:
          type: object
          properties:
            name:
              type: string
              description: Name for the reconciliation block
            base_expression:
              type: string
              description: Expression defining the value that requires reconciliation
            tolerance:
              type: number
              default: 0.01
              description: Acceptable residual tolerance after applying components
            severity:
              type: string
              enum: ["info", "warning", "error", "fatal"]
              default: "warning"
              description: Severity to associate with unbalanced reconciliations when allow_unexplained is false
            allow_unexplained:
              type: boolean
              default: false
              description: Allow residuals beyond tolerance without marking as unbalanced
            components:
              type: array
              description: Components that should sum to the base value
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the reconciliation component
                  description:
                    type: string
                    description: Human readable detail for this component
                  expression:
                    type: string
                    description: Expression evaluating the component amount
                required:
                  - name
                  - expression
            group_by:
              type: object
              description: Automatically generate reconciliation components by grouping extracted records
              properties:
                source:
                  type: string
                  description: Dot-delimited path to an array of objects used to build grouped components (e.g., "sale_events[].tender_details[]")
                field:
                  type: string
                  description: Field within each grouped object used as the grouping key
                label_field:
                  type: string
                  description: Optional field to derive human-friendly labels for grouped components
                missing_label:
                  type: string
                  description: Label to use when the grouping field is blank or missing
                  default: "unknown"
                filter:
                  type: string
                  description: Optional expression for filtering which records participate in the grouping
                value_expression:
                  type: string
                  description: Expression evaluated for each grouped record to produce the numeric contribution
                aggregation:
                  type: string
                  description: Aggregation strategy applied across grouped values (currently only "sum" is supported)
                  enum: ["sum"]
                  default: "sum"
                name_template:
                  type: string
                  description: Template for component names using {{group}} or {{label}} placeholders
                description_template:
                  type: string
                  description: Template for component descriptions using {{group}} or {{label}} placeholders
                overflow_strategy:
                  type: string
                  description: Strategy for handling grouped totals that exceed the base value
                  enum: ["none", "cap_to_base"]
                  default: "none"
              required:
                - source
                - field
                - value_expression
          required:
            - name
            - base_expression
            - components
      validations:
        type: array
        description: Validation rules to check data quality
        items:
          type: object
          properties:
            name:
              type: string
              description: Name of the validation check
            rule:
              type: string
              description: Boolean expression to evaluate (can reference aggregations and accumulations)
            severity:
              type: string
              enum: ["info", "warning", "error", "fatal"]
              default: "error"
              description: Severity level if validation fails
            message:
              type: string
              description: Message template to display if validation fails (supports {variable} substitution)
          required:
            - name
            - rule
            - severity
            - message
  summaries:
    type: array
    description: Optional declarative summaries to include within the extract payload
    items:
      type: object
      properties:
        name:
          type: string
          description: Identifier for the summary block
        label:
          type: string
          description: Human readable label for display
        format:
          type: string
          description: Presentation hint (e.g., "count", "currency")
        total:
          type: object
          description: Total value definition for the summary
          properties:
            expression:
              type: string
              description: Expression evaluated to compute the total value
          required:
            - expression
        components:
          type: array
          description: Components that compose the summary total
          items:
            type: object
            properties:
              name:
                type: string
                description: Identifier for the summary component
              label:
                type: string
                description: Human readable label for the component
              expression:
                type: string
                description: Expression evaluated to compute the component value
              remainder:
                type: boolean
                description: When true, component captures the remaining portion of the total after other components
              format:
                type: string
                description: Presentation hint (e.g., "count", "currency")
            required:
              - name
            additionalProperties: false
      required:
        - name
        - total
        - components
required:
  - record_type
  - match_selectors
  - field_mappings
  - output_schema
