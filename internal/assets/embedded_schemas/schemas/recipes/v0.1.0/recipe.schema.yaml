$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Sumpter Recipe Manifest"
description: "Structured metadata for Sumpter recipe workspaces"
type: object
additionalProperties: false
required:
  - version
  - id
  - kind
  - assets
properties:
  version:
    type: string
    const: "recipe/v0.1.0"
  id:
    type: string
    pattern: "^[a-zA-Z0-9_.-]+$"
  kind:
    type: string
    enum: ["extract", "acquire"]
  display_name:
    type: string
    maxLength: 200
  description:
    type: string
  tags:
    type: array
    items:
      type: string
  created_at:
    type: string
    format: date-time
  content_version:
    description: |
      Author-managed SemVer 2.0.0 version for the recipe's extraction
      content (signature + extract assets). Optional in v0.1.3; sumpter
      emits a deprecation warning when absent and records
      `recipe_version` as "unversioned" in provenance. v0.1.4 will make
      this a required field and bump the manifest schema to v0.2.0.
      See ADR-0006 for the canonicalization and content-hash rules.
    type: string
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
  owners:
    type: array
    items:
      type: object
      required: ["name"]
      additionalProperties: false
      properties:
        name:
          type: string
        contact:
          description: |
            Optional contact for the owner (typically an email). Required
            when the recipe participates in v0.1.4+ signing/encryption
            attestation.
          type: string
        role:
          description: |
            Optional role slug (e.g. "india-devlead") identifying the
            owner's chain-of-trust position. Required when the recipe
            participates in v0.1.4+ signing/encryption attestation.
          type: string
  documentation:
    type: object
    additionalProperties: false
    properties:
      overview:
        type: string
      changelog:
        type: string
      references:
        type: array
        items:
          type: string
  assets:
    type: object
    additionalProperties: false
    required: []
    properties:
      signature:
        type: string
      extract:
        type: string
      validation:
        type: string
      retrieve:
        type: string
      extras:
        type: array
        items:
          type: string
  defaults:
    type: object
    additionalProperties: false
    properties:
      input:
        type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum: ["files", "path"]
          files:
            type: array
            items:
              type: string
          path:
            type: string
          include_pattern:
            type: string
          exclude_pattern:
            type: string
          max_depth:
            type: integer
            minimum: 0
          follow_symlinks:
            type: boolean
      output:
        type: object
        additionalProperties: false
        properties:
          format:
            type: string
            enum: ["json", "ndjson", "parquet"]
          formats:
            type: array
            items:
              type: string
              enum: ["json", "ndjson", "parquet"]
            uniqueItems: true
          path:
            type: string
          pattern:
            type: string
          patterns:
            type: object
            propertyNames:
              enum: ["json", "ndjson", "parquet"]
            additionalProperties:
              type: string
          parquet:
            type: object
            additionalProperties: false
            properties:
              compression:
                type: string
                enum: ["zstd", "snappy", "gzip", "none"]
      client_id:
        type: string
      site_id:
        type: string
      parameters:
        type: object
        description: |
          Free-form key/value pairs injected as fields into every
          extracted record's extract.data block. Keys are output field
          names; values are literal string scalars.
        additionalProperties:
          type: string
      parameters_required:
        type: array
        description: |
          Parameter keys that must resolve to a non-empty value at
          recipe run time, from defaults.parameters or CLI
          --parameter key=value overrides.
        items:
          type: string
          minLength: 1
        uniqueItems: true
      source_extraction:
        type: array
        description: |
          File-level fields extracted once from the input filename,
          relative_path, or absolute_path before record extraction.
        maxItems: 32
        items:
          type: object
          additionalProperties: false
          required: ["source", "pattern"]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*$"
              maxLength: 64
            source:
              type: string
              enum: ["filename", "relative_path", "absolute_path"]
            pattern:
              type: string
              maxLength: 1024
      source_extraction_required:
        type: array
        description: |
          Source-derived field names that must be captured from each
          source file before defaults.parameters or CLI parameters are
          merged.
        items:
          type: string
          minLength: 1
        uniqueItems: true
      workers:
        type: integer
        minimum: 1
      progress:
        type: boolean
  notes:
    type: string
