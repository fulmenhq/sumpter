record_type: widget_return_order
match_selectors:
  - xpath: //Order[@type='return']
field_mappings:
  - output_field: order_id
    xpath: "@id"
    type: string
  - output_field: customer
    xpath: Customer/text()
    type: string
  - output_field: status
    xpath: Status
    type: string
output_schema:
  type: object
  properties:
    order_id:
      type: string
    customer:
      type: string
    status:
      type: string
  required: [order_id, customer, status]
