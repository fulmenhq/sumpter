record_type: widget_optional_order
match_selectors:
  - xpath: //Order
field_mappings:
  - output_field: order_id
    xpath: "@id"
    type: string
  - output_field: customer
    xpath: Customer/text()
    type: string
  - output_field: priority_code
    xpath: PriorityCode
    type: string
  - output_field: suspended
    xpath: "@suspended"
    type: boolean
output_schema:
  type: object
  properties:
    order_id:
      type: string
    customer:
      type: string
    priority_code:
      type: string
    suspended:
      type: boolean
  required: [order_id, customer, suspended]
