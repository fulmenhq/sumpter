version: "recipe/v0.1.0"
kind: "extract"
id: widget_verdict_matrix
display_name: "WidgetCo Per-Record Verdict Matrix"
created_at: "2026-11-02T00:00:00Z"
content_version: "0.0.1"
assets:
  signature: signature/widget-signature.yaml
  extract: extract/widget-extract.yaml
defaults:
  parameters:
    curated_prefixes: ["NM_", "NR_"]
  parameters_internal:
    - curated_prefixes
  value_profile:
    enabled: true
    max_distinct: 10
    small_cell_threshold: 1
    fields:
      - field: verdict
        safe_to_profile: true
        sensitivity: public
  output:
    format: json
    pattern: records.jsonl
  workers: 1
  progress: false
