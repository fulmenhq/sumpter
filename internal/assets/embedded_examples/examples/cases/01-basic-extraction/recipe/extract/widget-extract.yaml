record_type: widget_order
match_selectors:
  - xpath: //Order
field_mappings:
  - output_field: order_id
    xpath: "@id"
    type: string
  - output_field: customer
    xpath: Customer
    type: string
  - output_field: status
    xpath: "@status"
    type: string
  - output_field: total_amount
    xpath: TotalAmount
    type: number
output_schema:
  type: object
  properties:
    order_id:
      type: string
    customer:
      type: string
    status:
      type: string
    total_amount:
      type: number
  required: [order_id, customer, status, total_amount]
