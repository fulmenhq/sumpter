# Sumpter Retrieve Configuration Example
# This is an example configuration file for Sumpter's retrieve commands.
#
# IMPORTANT: This file contains example values only. You MUST:
# 1. Copy this file to your SUMPTER_HOME/configs/ directory
# 2. Replace example values with your actual company information
# 3. Run 'sumpter envinfo paths' to find your SUMPTER_HOME location
#
# SEC EDGAR requires proper user-agent identification for compliance.
# Do not use generic or placeholder values.

version: "retrieve/v0.1.0"
realms:
  finance:
    enabled: true
    client:
      # REQUIRED: User-Agent must follow SEC format "Company Name contact@email.com"
      # Example: "Acme Corporation compliance@acme.com"
      user_agent: "Your Company Name contact@yourcompany.com"
      timeout_seconds: 30
    rate_limits:
      requests_per_second: 8
      burst_limit: 5
      backoff_seconds: 1
    # Optional: API endpoints (for future use with commercial providers)
    endpoints:
      sec_edgar_base: "https://data.sec.gov"
    # Optional: Realm-specific options
    options:
      # Future: enable caching, custom headers, etc.