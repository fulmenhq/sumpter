name: Verify Embedded Assets
# Runs scripts/verify-embeds.sh on PRs and main pushes that touch SSOT or
# embedded paths. Catches the class of bug where someone updates a source
# doc/schema/example/template but forgets to re-run scripts/embed-assets.sh
# (or vice versa), leaving the binary's embedded mirror out of sync.
"on":
  pull_request:
    paths:
      - "docs/**"
      - "schemas/**"
      - "examples/**"
      - "templates/**"
      - "internal/assets/embedded_docs/**"
      - "internal/assets/embedded_schemas/**"
      - "internal/assets/embedded_examples/**"
      - "internal/assets/embedded_templates/**"
      - "scripts/embed-assets.sh"
      - "scripts/verify-embeds.sh"
      - ".github/workflows/verify-embeds.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schemas/**"
      - "examples/**"
      - "templates/**"
      - "internal/assets/embedded_docs/**"
      - "internal/assets/embedded_schemas/**"
      - "internal/assets/embedded_examples/**"
      - "internal/assets/embedded_templates/**"
      - "scripts/embed-assets.sh"
      - "scripts/verify-embeds.sh"
jobs:
  verify:
    name: scripts/verify-embeds.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Confirm rsync is present
        run: rsync --version | head -1
      - name: Run verify-embeds
        run: make verify-embeds
