# Seekable-Zstd Integration CI
#
# Validates that seekable-zstd CGO bindings link and run correctly on:
# - Linux glibc (Debian Bookworm)
# - Linux musl (Alpine)
#
# This workflow proves the cross-platform compatibility required for v0.1.2.
#
# Reference: .plans/active/v0.1.2/seekable-zstd-integration-mvp.md
name: Seekable-Zstd Integration
on:
  push:
    branches:
      - main
    paths:
      - 'internal/index/**'
      - 'internal/extract/parallel/**'
      - 'cmd/sumpter/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/seekable-zstd-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'internal/index/**'
      - 'internal/extract/parallel/**'
      - 'cmd/sumpter/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/seekable-zstd-integration.yml'
  workflow_dispatch:
jobs:
  # Linux glibc job - Debian Bookworm
  linux-glibc:
    name: Linux glibc (Debian Bookworm)
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential
      - name: Environment info
        run: |
          echo "=== System Info ==="
          uname -a
          cat /etc/os-release | head -5

          echo ""
          echo "=== Go Environment ==="
          go version
          go env GOOS GOARCH CGO_ENABLED

          echo ""
          echo "=== libc version ==="
          ldd --version | head -1
      - name: Download dependencies
        run: |
          go mod download
          go mod verify
      - name: Locate seekable-zstd module
        run: |
          echo "=== Module Location ==="
          SZST_MOD="github.com/3leaps/seekable-zstd/bindings/go"
          MODDIR=$(go list -m -f '{{.Dir}}' "$SZST_MOD")
          echo "seekable-zstd module: $MODDIR"

          echo ""
          echo "=== Static Library ==="
          LIBDIR="$MODDIR/lib/linux-amd64"
          if [ -d "$LIBDIR" ]; then
            ls -la "$LIBDIR"
          else
            echo "Library directory not found at $LIBDIR"
            echo "Checking alternate locations..."
            find "$MODDIR" -name "*.a" -type f 2>/dev/null \
              || echo "No .a files found"
          fi
      - name: Build with seekablezstd tag
        run: |
          echo "=== Building with CGO + seekablezstd ==="
          CGO_ENABLED=1 go build -buildvcs=false -tags seekablezstd ./...
      - name: Run seekable-zstd tests
        run: |
          echo "=== Running seekable-zstd integration tests ==="
          CGO_ENABLED=1 go test -v -tags seekablezstd ./internal/index/store/...
      - name: Run full test suite with seekablezstd
        run: |
          echo "=== Running full test suite ==="
          CGO_ENABLED=1 go test -tags seekablezstd ./...
  # Linux musl job - Alpine
  linux-musl:
    name: Linux musl (Alpine)
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apk add --no-cache build-base git
      - name: Environment info
        run: |
          echo "=== System Info ==="
          uname -a
          cat /etc/os-release | head -5

          echo ""
          echo "=== Go Environment ==="
          go version
          go env GOOS GOARCH CGO_ENABLED

          echo ""
          echo "=== libc version ==="
          ldd 2>&1 | head -1 || echo "musl libc"
      - name: Download dependencies
        run: |
          go mod download
          go mod verify
      - name: Locate seekable-zstd module
        run: |
          echo "=== Module Location ==="
          SZST_MOD="github.com/3leaps/seekable-zstd/bindings/go"
          MODDIR=$(go list -m -f '{{.Dir}}' "$SZST_MOD")
          echo "seekable-zstd module: $MODDIR"

          echo ""
          echo "=== Static Library ==="
          LIBDIR="$MODDIR/lib/linux-amd64-musl"
          if [ -d "$LIBDIR" ]; then
            ls -la "$LIBDIR"
          else
            echo "Library directory not found at $LIBDIR"
            echo "Checking alternate locations..."
            find "$MODDIR" -name "*.a" -type f 2>/dev/null \
              || echo "No .a files found"
          fi
      - name: Build with seekablezstd and musl tags
        run: |
          echo "=== Building with CGO + seekablezstd + musl ==="
          CGO_ENABLED=1 go build -buildvcs=false -tags "seekablezstd musl" ./...
      - name: Run seekable-zstd tests
        run: |
          echo "=== Running seekable-zstd integration tests ==="
          CGO_ENABLED=1 go test -v -tags "seekablezstd musl" \
            ./internal/index/store/...
      - name: Run full test suite with seekablezstd
        run: |
          echo "=== Running full test suite ==="
          CGO_ENABLED=1 go test -tags "seekablezstd musl" ./...
