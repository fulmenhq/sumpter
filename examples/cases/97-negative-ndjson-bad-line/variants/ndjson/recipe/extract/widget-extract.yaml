record_type: widget_order
match_selectors:
  - xpath: Order
field_mappings:
  - output_field: order_id
    xpath: id
    type: string
  - output_field: customer
    xpath: Customer
    type: string
  - output_field: status
    xpath: status
    type: string
  - output_field: quantity
    xpath: Quantity
    type: integer
  - output_field: total_amount
    xpath: TotalAmount
    type: number
  - output_field: rush
    xpath: Rush
    type: boolean
output_schema:
  type: object
  properties:
    order_id:
      type: string
    customer:
      type: string
    status:
      type: string
    quantity:
      type: integer
    total_amount:
      type: number
    rush:
      type: boolean
  required: [order_id, customer, status, quantity, total_amount, rush]
