version: "recipe/v0.1.0"
kind: "extract"
id: widget_line_items_parquet
display_name: "Widget Line Items with Parquet Projection"
created_at: "2026-05-18T00:00:00Z"
content_version: "0.0.1"
assets:
  signature: signature/widget-signature.yaml
  extract: extract/widget-extract.yaml
defaults:
  input:
    mode: files
    files:
      - ../input.xml
  output:
    formats: [json, parquet]
    path: ../outputs
    patterns:
      json: records.jsonl
      parquet: records.parquet
    parquet:
      compression: zstd
  workers: 1
  progress: false
