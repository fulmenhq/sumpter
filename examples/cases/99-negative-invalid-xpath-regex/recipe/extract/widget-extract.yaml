record_type: widget_order_bad_regex
match_selectors:
  - xpath: //Order
field_mappings:
  - output_field: order_id
    xpath: "@id"
    type: string
  - output_field: is_curated_sku
    xpath: "matches(SKU, '[unclosed')"
    type: boolean
output_schema:
  type: object
  properties:
    order_id:
      type: string
    is_curated_sku:
      type: boolean
  required: [order_id, is_curated_sku]
