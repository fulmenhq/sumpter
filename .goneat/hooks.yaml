version: 1.0.0
hooks:
  pre-commit:
    - command: assess
      args:
        - --categories
        - format,lint,dates
        - --fail-on
        - high
        - --package-mode
        - --new-issues-only
        - --new-issues-base
        - main
      priority: 10
      timeout: 2m
  pre-push:
    - command: assess
      args:
        - --categories
        - format,lint,dates,static-analysis
        - --fail-on
        - critical
        - --package-mode
        - --new-issues-only
        - --new-issues-base
        - main
      priority: 10
      timeout: 3m
optimization:
  cache_results: true
  content_source: index
  only_changed_files: true
  parallel: auto
