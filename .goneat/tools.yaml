# goneat Tools Configuration (v1.0.0)
# Generated by: goneat doctor tools init
#
# This file is the SINGLE SOURCE OF TRUTH for tools configuration.
# There are NO hidden defaults or runtime merging.
#
# Edit this file to:
# - Add/remove tools
# - Change tool detection commands
# - Modify installer priorities
# - Define custom scopes
#
# Validate changes with: goneat doctor tools validate
# See schema: schemas/tools/tools.v1.0.0.json
scopes:
  all:
    description: All Sumpter development tools
    tools:
      - go
      - go-licenses
      - golangci-lint
      - goimports
      - gofmt
      - gosec
      - govulncheck
      - yamlfmt
      - yq
      - prettier
  foundation:
    description: Core project tools used by Sumpter developer workflows
    tools:
      - yamlfmt
      - yq
  format:
    description: Formatting tools used by Sumpter developer workflows
    tools:
      - gofmt
      - goimports
      - yamlfmt
      - prettier
  go:
    description: Go development tools
    tools:
      - go
      - go-licenses
      - golangci-lint
      - goimports
      - gofmt
      - gosec
      - govulncheck
  security:
    description: Go security scanning tools
    tools:
      - gosec
      - govulncheck
  sumpter:
    description: Sumpter project-specific development tools
    tools:
      - golangci-lint
      - yamlfmt
      - yq
tools:
  prettier:
    name: prettier
    description: Code formatter for Markdown, JSON, and YAML (used by `goneat format`)
    kind: node
    detect_command: prettier --version
    version_args:
      - --version
    installer_priority:
      all:
        - npm
        - bun
  yq:
    name: yq
    description: YAML/JSON processor with jq-compatible syntax
    kind: go
    detect_command: yq --version
    install_package: github.com/mikefarah/yq/v4@latest
    version_args:
      - --version
    installer_priority:
      all:
        - go-install
    version_scheme: semver
    minimum_version: 4.30.0
    recommended_version: 4.52.4
  yamlfmt:
    name: yamlfmt
    description: YAML formatter and linter
    kind: go
    detect_command: yamlfmt --version || yamlfmt -version
    install_package: github.com/google/yamlfmt/cmd/yamlfmt@latest
    version_args:
      - --version
    installer_priority:
      all:
        - go-install
    version_scheme: semver
    minimum_version: 0.9.0
    recommended_version: 0.21.0
  go:
    name: go
    description: Go toolchain
    kind: system
    detect_command: go version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
        - winget
    version_scheme: semver
    minimum_version: 1.26.6
    recommended_version: 1.26.6
  go-licenses:
    name: go-licenses
    description: License compliance for Go dependencies
    kind: go
    detect_command: go-licenses -h
    install_package: github.com/google/go-licenses@latest
    check_args:
      - -h
    installer_priority:
      all:
        - go-install
  gofmt:
    name: gofmt
    description: Go formatter (bundled with Go toolchain)
    kind: bundled-go
    detect_command: gofmt -h
    check_args:
      - -h
    installer_priority:
      all:
        - builtin
  goimports:
    name: goimports
    description: Go import formatter
    kind: go
    detect_command: goimports -h
    install_package: golang.org/x/tools/cmd/goimports@latest
    check_args:
      - -h
    installer_priority:
      all:
        - go-install
  golangci-lint:
    name: golangci-lint
    description: Fast linters runner for Go
    kind: go
    detect_command: golangci-lint --version
    install_package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2
    version_args:
      - --version
    check_args:
      - --help
    installer_priority:
      all:
        - go-install
    version_scheme: semver
    minimum_version: 2.11.2
    recommended_version: 2.11.2
  gosec:
    name: gosec
    description: Go security checker
    kind: go
    detect_command: gosec -version
    install_package: github.com/securego/gosec/v2/cmd/gosec@latest
    version_args:
      - -version
    check_args:
      - -h
    installer_priority:
      darwin:
        - brew
        - go-install
      linux:
        - brew
        - go-install
      windows:
        - go-install
    version_scheme: semver
    minimum_version: 2.18.0
    recommended_version: 2.23.0
  govulncheck:
    name: govulncheck
    description: Go vulnerability checker
    kind: go
    detect_command: govulncheck -version
    install_package: golang.org/x/vuln/cmd/govulncheck@latest
    version_args:
      - -version
    check_args:
      - -h
    installer_priority:
      all:
        - go-install
    version_scheme: semver
    minimum_version: 1.0.0
    recommended_version: 1.1.0
